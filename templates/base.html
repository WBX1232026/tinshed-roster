<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tinshed Roster{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f5;
            color: #222;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 20px 40px;
        }
        header h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
        }
        a {
            color: #2980b9;
            text-decoration: underline;
        }
        a:hover {
            color: #1f618d;
        }
        nav a {
            color: #ecf0f1;
            text-decoration: none;
            margin-right: 20px;
            font-size: 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 960px;
            margin: 40px auto;
            padding: 0 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 30px 40px;
        }
        h2 {
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-top: 0;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 16px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background: #f0f0f0;
            font-weight: bold;
        }
        tr:nth-child(even) {
            background: #fafafa;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 6px;
        }
        .empty {
            color: #888;
            font-style: italic;
        }
        .hole {
            color: #c0392b;
            font-weight: bold;
        }
        .filled {
            color: #27ae60;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tinshed Roster</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/volunteers">Volunteers</a>
            <a href="/productions">Productions</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
